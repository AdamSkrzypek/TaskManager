name: CI

on:
  push:
    branches:
      - master
      - development
  pull_request:
    branches:
      - master
      - development
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: task_manager_db
          POSTGRES_USER: ci_${{ github.run_id }}
          POSTGRES_PASSWORD: ci_${{ github.run_id }}_${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_${{ github.run_id }} -d task_manager_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Verify backend
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/task_manager_db
          SPRING_DATASOURCE_USERNAME: ci_${{ github.run_id }}
          SPRING_DATASOURCE_PASSWORD: ci_${{ github.run_id }}_${{ github.run_attempt }}
        run: ./mvnw --batch-mode --no-transfer-progress verify

  frontend:
    name: Frontend (Node.js 22)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build
